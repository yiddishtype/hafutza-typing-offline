name: build
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag to publish under, e.g. v1.1 (empty = test only)"
        default: ""
      version:
        description: "Program version"
        default: "1.1"
      replace_v10:
        description: "Also put the new full installer at the v1.0 link the owner has (yes/no)"
        default: "yes"
      long_tests:
        description: "Run the 13.8-min speed test and the website comparison (yes/no)"
        default: "no"
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: machine
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table
          (Get-CimInstance Win32_OperatingSystem).Caption
      - name: python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pillow
          pip uninstall -y onnxruntime
      - name: models that go into the installer (Yiddish speech) + small files of all
        run: |
          gh release download models-v1 -p small-files.zip -p models.json -p yi-model.bin -D build\dl
          Expand-Archive build\dl\small-files.zip build\models
          Move-Item build\dl\models.json build\models\
          Move-Item build\dl\yi-model.bin build\models\yi\model.bin
          Get-ChildItem -Recurse build\models | Format-Table Length,FullName
      - name: icon
        run: python tools/make_icon.py build\hafutza.ico
      - name: pyinstaller
        run: |
          pyinstaller --noconfirm --windowed --name HafutzaTyping --icon build\hafutza.ico --paths app `
            --collect-all ctranslate2 --collect-data faster_whisper --hidden-import sentencepiece `
            --collect-all yt_dlp --collect-all yt_dlp_ejs --hidden-import PySide6.QtNetwork `
            --exclude-module onnxruntime --exclude-module tkinter --exclude-module torch app\hafutza.py
          Copy-Item -Recurse build\models dist\HafutzaTyping\models
          Copy-Item build\hafutza.ico dist\HafutzaTyping\
          Set-Content -NoNewline -Encoding ascii dist\HafutzaTyping\version.txt "${{ inputs.version }}"
          "{0:N0} MB" -f ((Get-ChildItem -Recurse dist\HafutzaTyping | Measure-Object Length -Sum).Sum / 1MB)
      - name: installers (full + update-only) and a test "1.2" update
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /Q "/DMyAppVersion=${{ inputs.version }}" installer\hafutza.iss; if ($LASTEXITCODE) { exit 1 }
          & $iscc /Q "/DMyAppVersion=${{ inputs.version }}" /DAppOnly installer\hafutza.iss; if ($LASTEXITCODE) { exit 1 }
          Set-Content -NoNewline -Encoding ascii dist\HafutzaTyping\version.txt "1.2"
          & $iscc /Q "/DMyAppVersion=1.2" /DAppOnly /DOutName=HafutzaTyping-Update-test12 installer\hafutza.iss; if ($LASTEXITCODE) { exit 1 }
          Set-Content -NoNewline -Encoding ascii dist\HafutzaTyping\version.txt "${{ inputs.version }}"
          Get-ChildItem Output | Format-Table Length,Name
          New-Item -ItemType Directory -Force C:\upd | Out-Null
          Copy-Item Output\HafutzaTyping-Update-test12.exe C:\upd\
          python tools/make_manifest.py Output\HafutzaTyping-Update-test12.exe 1.2 http://127.0.0.1:8000/HafutzaTyping-Update-test12.exe C:\upd\new.json "Test update"
          python tools/make_manifest.py Output\HafutzaTyping-Update-test12.exe ${{ inputs.version }} http://127.0.0.1:8000/HafutzaTyping-Update-test12.exe C:\upd\same.json
          python -c "import json; m=json.load(open(r'C:\upd\new.json')); m['version']='1.3'; m['sha256']='0'*64; json.dump(m, open(r'C:\upd\bad.json','w'))"
          python tools/make_manifest.py Output\HafutzaTyping-Update.exe ${{ inputs.version }} "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release || 'test' }}/HafutzaTyping-Update.exe" Output\update.json "Update button, drop box for several files, video links, Open with."
      - name: like the owner's PC - install the published v1.0 and let it download the parts (3 GB) and type a clip
        run: |
          gh release download v1.0 -p HafutzaTyping-Setup.exe -D C:\v10
          $p = Start-Process -FilePath C:\v10\HafutzaTyping-Setup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          "v1.0 installer exit $($p.ExitCode)"
          Get-Content "$env:LOCALAPPDATA\Programs\Hafutza Typing\version.txt" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force C:\st | Out-Null
          python tools/run_selftest.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" tests\clip30.mp3 yi yi C:\st\t0 --download --timeout 30
          Get-ChildItem "$env:USERPROFILE\Documents\Hafutza Typing" | Format-Table Length,Name
      - name: install v1.1 over v1.0 (what the owner does once by hand)
        run: |
          $p = Start-Process -FilePath Output\HafutzaTyping-Setup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=C:\st-install.log' -PassThru -Wait
          "installer exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content C:\st-install.log -Tail 40; exit 1 }
          Get-Content "$env:LOCALAPPDATA\Programs\Hafutza Typing\version.txt"
          Get-ChildItem -Recurse "$env:LOCALAPPDATA\Programs\Hafutza Typing\models" -Filter model.bin | Format-Table Length,FullName
          Get-ChildItem "$env:USERPROFILE\Documents\Hafutza Typing" | Format-Table Length,Name
          (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8E3B6F7A-2C1D-4B8E-9F21-6A5D3C7E1B42}_is1").DisplayVersion
          "Open with: " + (Get-ItemProperty "HKCU:\Software\Classes\Applications\HafutzaTyping.exe\shell\open\command").'(default)'
          Test-Path "HKCU:\Software\Classes\.mp4\OpenWithList\HafutzaTyping.exe"
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Hafutza Typing\models\nllb\model.bin")) { "downloaded parts LOST"; exit 1 }
      - name: test 1 - Yiddish clip with a Hebrew file name, all 5 outputs (no new download needed after the update)
        run: |
          python -c "import shutil; shutil.copy('tests/clip30.mp3', 'C:/st/\u05d1\u05d3\u05d9\u05e7\u05d4 clip30.mp3')"
          python tools/run_selftest.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" "C:\st\$([char]0x05d1)$([char]0x05d3)$([char]0x05d9)$([char]0x05e7)$([char]0x05d4) clip30.mp3" yi yi,en,he,es,fr C:\st\t1 --timeout 30
          python -c "import json; r=json.load(open(r'C:\st\t1\report.json',encoding='utf-8')); print('missing_before', r['missing_before']); exit(1 if r['missing_before'] else 0)"
      - name: test 2 - English speech (Windows' own voice) to English + Yiddish
        continue-on-error: true
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("C:\st\english.wav")
          $s.Speak("Good morning. Today we will talk about the history of the town and the people who built it. Thank you for coming, and please sit down.")
          $s.Dispose()
          python tools/run_selftest.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" C:\st\english.wav en en,yi C:\st\t2 --timeout 20
      - name: test 3 - drop 3 files at once on the drop box (2 videos + Hebrew-named mp3), typed one after another
        run: |
          python tools/run_selftest.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" tests\clip30.mp4 yi yi,en C:\st\t3 --timeout 30 --more tests\clip60.mp4 --more "C:\st\$([char]0x05d1)$([char]0x05d3)$([char]0x05d9)$([char]0x05e7)$([char]0x05d4) clip30.mp3" --drop
      - name: test 6 - a double click on the drop box opens the file browser once
        run: |
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" -ArgumentList '--click-test', "$pwd\tests\clip30.mp4", '--out', 'C:\st\t6' -PassThru -Wait
          Get-Content C:\st\t6\report.json
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: test 7 - Open with (the registered command) hands 2 files to the open window
        run: |
          $a = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" -ArgumentList '--report-after', '70', '--out', 'C:\st\t7' -PassThru
          Start-Sleep 12
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\Applications\HafutzaTyping.exe\shell\open\command").'(default)'
          foreach ($f in @("$pwd\tests\clip30.mp4", "$pwd\tests\clip60.mp4")) {
            $line = $cmd.Replace('%1', $f)
            $t = Get-Date
            $b = Start-Process -FilePath cmd.exe -ArgumentList '/c', "`"$line`"" -PassThru
            if ($b.WaitForExit(40000)) { "second start handed its file over and ended after $([int]((Get-Date) - $t).TotalSeconds) s" }
            else { "second start did NOT end (opened its own window?)"; taskkill /PID $b.Id /T /F }
          }
          $a.WaitForExit(120000) | Out-Null
          Get-Content C:\st\t7\report.json
          Get-Content "$env:LOCALAPPDATA\HafutzaTyping\log.txt" | Select-Object -Last 15
          python -c "import json; r=json.load(open(r'C:\st\t7\report.json',encoding='utf-8')); exit(0 if len(r['files'])==2 else 1)"
      - name: test 8 - video links (YouTube, Facebook, a wrong link) from this machine
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" -ArgumentList '--link-test', '"https://www.youtube.com/watch?v=jNQXAC9IVRw https://www.facebook.com/cnn/videos/10155529876156509/ https://example.com/nothing-here"', '--out', 'C:\st\t8' -PassThru -Wait
          Get-Content C:\st\t8\report.json
          Get-Content "$env:LOCALAPPDATA\HafutzaTyping\log.txt" | Select-String "link" | Select-Object -Last 12
      - name: update test A - Update button when this is the newest version
        run: python tools/update_e2e.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" http://127.0.0.1:8000/same.json newest C:\st\uA --serve C:\upd
      - name: update test B - a damaged download is refused and nothing changes
        run: python tools/update_e2e.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" http://127.0.0.1:8000/bad.json error C:\st\uB --serve C:\upd
      - name: update test C - Update button finds a test 1.2, downloads, installs, opens again, keeps parts and texts
        run: python tools/update_e2e.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" http://127.0.0.1:8000/new.json 1.2 C:\st\uC --serve C:\upd
      - name: publish
        if: ${{ inputs.release != '' }}
        run: |
          $r = "${{ inputs.release }}"
          gh release view $r 2>$null
          if ($?) { gh release upload $r Output\HafutzaTyping-Setup.exe Output\HafutzaTyping-Update.exe Output\update.json --clobber }
          else { gh release create $r Output\HafutzaTyping-Setup.exe Output\HafutzaTyping-Update.exe Output\update.json --title "Hafutza Typing $r for Windows" --notes-file installer\release-notes.md }
          if ("${{ inputs.replace_v10 }}" -eq "yes") {
            gh release upload v1.0 Output\HafutzaTyping-Setup.exe --clobber
            gh release edit v1.0 --notes-file installer\release-notes.md --title "Hafutza Typing for Windows (this link always gives the newest version: now ${{ inputs.version }})"
          }
          gh release view updates 2>$null
          if ($?) { gh release upload updates Output\update.json --clobber }
          else { gh release create updates Output\update.json --prerelease --title "Update check (used by the program's Update button)" --notes "update.json: the newest version of Hafutza Typing for the Update button." }
      - name: update test D - the real thing - a program that says 1.0 asks GitHub, gets the published update, installs it
        if: ${{ inputs.release != '' }}
        run: |
          Set-Content -NoNewline -Encoding ascii "$env:LOCALAPPDATA\Programs\Hafutza Typing\version.txt" "1.0"
          python tools/update_e2e.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" real ${{ inputs.version }} C:\st\uD
      - name: test 5 - same 60 s video the website typed (Nov 17) - how close is the text
        if: ${{ inputs.long_tests == 'yes' }}
        continue-on-error: true
        run: |
          python tools/run_selftest.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" tests\clip60.mp4 yi yi C:\st\t5 --timeout 20
          python tools/compare.py tests\site-clip60-yi.txt C:\st\t5\text-yi.txt
      - name: test 4 - speed, 13.8 minutes of Yiddish to Yiddish + English
        if: ${{ inputs.long_tests == 'yes' }}
        continue-on-error: true
        run: |
          python tools/run_selftest.py "$env:LOCALAPPDATA\Programs\Hafutza Typing\HafutzaTyping.exe" tests\long.mp3 yi yi,en C:\st\t4 --timeout 60 --quiet 15
      - name: keep screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            C:\st\t*\*.png
            C:\st\t*\*.json
            C:\st\t*\*.txt
            C:\st\u*\*.png
            C:\st\u*\*.json
            C:\st-install.log
          retention-days: 14
